<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080e1b">

<script src="https://www.gstatic.com/firebasejs/13.0.0/firebase-messaging-compat.js"></script>
<style>
:root{--bg:#080e1b;--panel:#101b2d;--card:#142239;--line:#293a54;--blue:#3979f6;--gold:#e6c16e;--text:#f2f5fb;--muted:#9aa9bf;--green:#39c58b;--red:#ee6878}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#authScreen{min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at top,#20385c,var(--bg) 65%)}
.auth-card{width:100%;max-width:470px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:25px;box-shadow:0 20px 70px #0008}
.logo{font-size:30px;font-weight:800}.logo span{color:var(--gold)}
.auth-sub{color:var(--muted);line-height:1.5;margin:10px 0 24px}
.muted{color:var(--muted)}
.field{margin:13px 0}
label{display:block;margin-bottom:7px;font-size:13px;color:#c5d1e1}
input,select,textarea{width:100%;padding:12px;background:#0a1424;color:var(--text);border:1px solid var(--line);border-radius:10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
textarea{min-height:85px;resize:vertical}
.btn{padding:12px 16px;border:0;border-radius:10px;background:var(--blue);color:white;font-weight:700}
.btn.gold{background:var(--gold);color:#172033}
.btn.dark{background:#283a55}
.btn.red{background:#923746}
.btn:disabled{opacity:.6;cursor:wait}
.full{width:100%}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:18px 0}
.role-choice{min-height:105px;background:#142943;border:1px solid var(--line);border-radius:14px;color:white;padding:14px;text-align:center}
.role-choice .ico{font-size:27px;display:block;margin-bottom:9px}
.role-choice.selected{border:2px solid var(--gold);background:#24354b}
.small-btn{background:none;border:0;color:var(--gold);padding:10px 0}
.sidebar{width:250px;position:fixed;inset:0 auto 0 0;background:#0d1728;border-right:1px solid var(--line);padding:20px 14px;overflow:auto;z-index:10}
.brand{padding:4px 12px 22px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:2px;margin-top:5px}
.nav{display:flex;flex-direction:column;gap:5px}
.nav button{background:none;border:0;color:#b7c4d7;text-align:left;padding:12px;border-radius:10px}
.nav button.active,.nav button:hover{background:#1a2d49;color:white}
.nav button.active{border-left:3px solid var(--gold)}
#app{display:none;min-height:100vh}
.main{margin-left:250px;min-height:100vh}
.topbar{height:70px;position:sticky;top:0;z-index:5;background:#0d1728;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 27px}
.top-left{display:flex;align-items:center;gap:12px}
.topbar small{color:var(--muted)}
.avatar{width:39px;height:39px;border-radius:50%;background:var(--gold);color:#15213a;display:grid;place-items:center;font-weight:bold}
.menu-btn{display:none;background:none;border:1px solid var(--line);color:white;border-radius:8px;padding:8px 11px}
.content{max-width:1250px;margin:auto;padding:27px}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{font-size:25px;margin:0 0 6px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:17px;margin-bottom:15px;min-width:0}
.card h3{font-size:16px;margin:0 0 12px}
.card p{line-height:1.5;color:var(--muted)}
.stat{font-size:29px;color:var(--gold);font-weight:800;margin:10px 0}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.wide{grid-column:1/-1}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:#0d192b;border:1px solid var(--line);border-radius:11px;padding:13px;overflow-wrap:anywhere}
.item strong{display:block;margin-bottom:7px}
.item small{color:var(--muted)}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#253e62;color:#d4e3ff;font-size:11px}
.badge.gold{background:#4b402b;color:var(--gold)}
.badge.green{background:#164b3b;color:#83e4b9}
.badge.red{background:#512b37;color:#ffabb5}
.empty{border:1px dashed var(--line);border-radius:12px;text-align:center;padding:24px;color:var(--muted)}
.notice{padding:12px 14px;background:#2b2519;border:1px solid #705b30;color:#f0d58e;border-radius:10px;line-height:1.5;margin:12px 0;overflow-wrap:anywhere}
.table-wrap{overflow:auto}
table{border-collapse:collapse;width:100%;min-width:450px}
td,th{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--gold)}
.price{color:var(--gold);font-size:25px;font-weight:800;margin:7px 0}
#toast{display:none;position:fixed;z-index:30;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 17px;background:#223650;border:1px solid #4a668e;border-radius:12px;max-width:90%;width:max-content;box-shadow:0 8px 30px #0009;line-height:1.5;overflow-wrap:anywhere}
@media(max-width:950px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){
.sidebar{transform:translateX(-105%);transition:.25s;width:260px;box-shadow:12px 0 35px #0009}
.sidebar.open{transform:translateX(0)}
.main{margin-left:0}.menu-btn{display:block}
.topbar{height:62px;padding:0 13px}
.content{padding:18px 13px}
.two{grid-template-columns:1fr}
.card{padding:14px}
.page-head h1{font-size:22px}
}
@media(max-width:390px){.grid,.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style>
</head>
<body>

<div id="authScreen">
 <div class="auth-card">
  <div class="logo">Edu<span>Life</span> ✦</div>
  <p class="auth-sub">Elektron kundalik — ta'lim, baholar va natijalar bir joyda.</p>

  <div id="rolePicker">
   <h3>Kim sifatida kirasiz?</h3>
   <div class="role-grid">
    <button type="button" class="role-choice" data-role="student"><span class="ico">🎓</span>O'quvchi</button>

  </div>

    <div class="field">

  </div>
 </div>
</div>

<div id="app">
 <aside class="sidebar" id="sidebar">
  <div class="brand">
   <div class="logo">Edu<span>Life</span> ✦</div>
   <small>SMART EDUCATION PLATFORM</small>
  </div>

  <div style="border-top:1px solid var(--line);margin-top:18px;padding-top:15px">

 <main class="main">
  <header class="topbar">

    <button class="menu-btn" type="button" onclick="toggleMenu()">☰</button>
    <div><strong id="topName">EduLife</strong><br><small id="topRole">Yuklanmoqda...</small></div>
   </div>
   <div class="avatar" id="avatar">E</div>
  </header>
  <section class="content" id="page"></section>
 </main>
</div>
<div id="toast"></div>

<script>
const SUPABASE_URL="https://nqunhvbiiukqfswsntpf.supabase.co";

function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function toast(msg){
 const el=$("toast");
 el.textContent=msg;
 el.style.display="block";
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>el.style.display="none",10000);
}

function fail(e){
 console.error("EduLife xatoligi:",e);
 toast(e?.message||"Xatolik yuz berdi");
}

/* FIREBASE PUSH BILDIRISHNOMALARI */
function pushPermissionText(){
 if(!("Notification" in window))return "Bu brauzer bildirishnomalarni qo'llab-quvvatlamaydi.";
 if(Notification.permission==="granted")return "Brauzer ruxsati berilgan. Bildirishnomalarni ro'yxatdan o'tkazish mumkin.";
 if(Notification.permission==="denied")return "Brauzerda bildirishnomaga ruxsat rad etilgan. Sayt sozlamalaridan ruxsat bering.";
 return "Telefon bildirishnomalarini yoqish uchun tugmani bosing.";
}

async function getFirebaseMessaging(){
 if(!window.firebase||!firebase.messaging) {
  throw new Error("Firebase kutubxonasi yuklanmadi. Internetni tekshiring.");
 }

 const supported=await firebase.messaging.isSupported();
 if(!supported) {
  throw new Error("Bu brauzer Firebase push bildirishnomalarini qo'llab-quvvatlamaydi. Android Chrome orqali urinib ko'ring.");
 }

 if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
 firebaseMessaging=firebase.messaging();

 if(!firebaseForegroundListenerAdded){
  firebaseMessaging.onMessage(payload=>{
   const title=payload?.notification?.title||payload?.data?.title||"EduLife";
   const body=payload?.notification?.body||payload?.data?.body||"Yangi bildirishnoma keldi.";
   toast("🔔 "+title+" — "+body);
  });
  firebaseForegroundListenerAdded=true;
 }
 return firebaseMessaging;
}

async function enablePushNotifications(){
 const button=$("enablePushBtn");
 const status=$("pushStatus");

 if(button){
  button.disabled=true;
  button.textContent="Ulanmoqda...";
 }

 try{
  if(!user||!db)throw new Error("Avval EduLife akkauntingizga kiring.");
  if(!window.isSecureContext)throw new Error("Bildirishnomalar uchun sayt HTTPS manzilda ochilishi kerak.");
  if(!("serviceWorker" in navigator))throw new Error("Bu brauzer Service Worker xizmatini qo'llab-quvvatlamaydi.");
  if(!("Notification" in window))throw new Error("Bu brauzer Notification xizmatini qo'llab-quvvatlamaydi.");
  if(Notification.permission==="denied")throw new Error("Bildirishnomaga ruxsat avval rad etilgan. Chrome sayt sozlamalaridan Notifications → Allow qiling.");

  const permission=Notification.permission==="granted"
   ?"granted"
   :await Notification.requestPermission();

  if(permission!=="granted")throw new Error("Bildirishnomaga ruxsat berilmadi.");

  const registration=await navigator.serviceWorker.register("/firebase-messaging-sw.js",{scope:"/"});
  await navigator.serviceWorker.ready;

  const messaging=await getFirebaseMessaging();
  const token=await messaging.getToken({
   vapidKey:FIREBASE_VAPID_KEY,
   serviceWorkerRegistration:registration
  });

  if(!token)throw new Error("Firebase qurilma tokenini qaytarmadi.");

  const {error}=await db.from("push_subscriptions").upsert({
   user_id:user.id,
   token,
   updated_at:new Date().toISOString()
  },{onConflict:"user_id,token"});

  if(error)throw new Error("Token Supabase'ga saqlanmadi: "+error.message);

  if(status)status.textContent="✅ Telefon bildirishnomalari yoqildi va akkauntingizga bog'landi.";
  toast("✅ EduLife bildirishnomalari yoqildi!");
 }catch(e){
  if(status)status.textContent=e?.message||"Bildirishnomani yoqishda xatolik yuz berdi.";
  fail(e);
 }finally{
  if(button){
   button.disabled=false;
   button.textContent="🔔 Bildirishnomalarni yoqish";
  }
 }
}

function roleName(r){
 return ({student:"O'quvchi",teacher:"Ustoz",parent:"Ota-ona",admin:"Administrator"})[r]||r||"Foydalanuvchi";
}

function dateText(v){
 return v?new Date(v).toLocaleString("uz-UZ",{dateStyle:"medium",timeStyle:"short"}):"—";
}

function empty(v="Hozircha ma'lumot yo'q"){
 return `<div class="empty">${esc(v)}</div>`;
}

/* ID O'RNIGA ISM CHIQARISH */
function makeNameMap(people){
 return Object.fromEntries((people||[]).map(p=>[
  p.id,
  p.full_name||roleName(p.role)
 ]));
}

function personName(id,map){
 if(!id)return "—";
 return map?.[id]||"Foydalanuvchi";
}

function makeCourseMap(courses){
 return Object.fromEntries((courses||[]).map(c=>[c.id,c.title||"Kurs"]));
}

function courseName(id,map){
 if(!id)return "—";
 return map?.[id]||"Kurs nomi topilmadi";
}

function isTeacher(){
 return activeRole==="teacher"||activeRole==="admin";
}

function isAdmin(){
 return activeRole==="admin";
}

async function rows(table,columns="*"){
 const {data,error}=await db.from(table).select(columns);
 if(error)throw error;
 return data||[];
}

async function countRows(table){
 const {count,error}=await db.from(table).select("*",{count:"exact",head:true});
 if(error)throw error;
 return count||0;
}

function statCard(title,value,icon){
 return `<div class="card"><div class="muted">${icon} ${esc(title)}</div><div class="stat">${value}</div></div>`;
}

function field(name,label,placeholder="",type="text"){
 return `<div><label>${esc(label)}</label><input name="${esc(name)}" type="${esc(type)}" placeholder="${esc(placeholder)}" required></div>`;
}

function selectField(name,label,items,placeholder){
 return `<div><label>${esc(label)}</label><select name="${esc(name)}" required>
 <option value="">${esc(placeholder||"Tanlang")}</option>
 ${items.map(x=>`<option value="${esc(x.value)}">${esc(x.label)}</option>`).join("")}
 </select></div>`;
}

/* ROL TANLASH */
document.querySelectorAll("[data-role]").forEach(button=>{
 button.addEventListener("click",()=>chooseRole(button.dataset.role));
});

function chooseRole(role){
 selectedRole=role;

 document.querySelectorAll("[data-role]").forEach(b=>
  b.classList.toggle("selected",b.dataset.role===role)
 );

 $("rolePicker").classList.add("hidden");
 $("loginPanel").classList.remove("hidden");
 $("selectedRoleLabel").textContent=roleName(role);

 $("loginHint").textContent=role==="admin"
  ?"Admin emailingiz va parolingiz bilan kiring."
  :"Login va parolni administrator yoki ustoz bergan bo'lishi kerak.";

 $("loginName").placeholder=role==="admin"?"Admin emailingiz":"Sizga berilgan login";
 $("loginName").value="";
 $("loginPassword").value="";
 $("loginName").focus();
}

function backToRoles(){
 $("loginPanel").classList.add("hidden");
 $("rolePicker").classList.remove("hidden");
 document.querySelectorAll("[data-role]").forEach(b=>b.classList.remove("selected"));
 selectedRole=null;
}

/* LOGIN */
$("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();

 if(!db){
  toast("Supabase hali ulanmagan. Internetni tekshiring.");
  return;
 }

 if(!selectedRole){
  toast("Avval rolingizni tanlang.");
  return;
 }

 const button=$("loginButton");
 button.disabled=true;
 button.textContent="Tekshirilmoqda...";

 try{
  const login=$("loginName").value.trim();
  const password=$("loginPassword").value;

  if(!login||!password)throw new Error("Login va parolni kiriting.");

  const email=login.includes("@")
   ?login.toLowerCase()
   :login.toLowerCase()+"@login.edulife.invalid";

  const {error:signOutError}=await db.auth.signOut();
  if(signOutError)console.warn("Oldingi sessiyani yopish:",signOutError.message);

  const {data,error}=await db.auth.signInWithPassword({email,password});

  if(error)throw new Error("Login xatosi: "+error.message);
  if(!data?.user)throw new Error("Supabase foydalanuvchini qaytarmadi.");

  await enterApp(data.user,selectedRole);

 }catch(e){
  fail(e);
 }finally{
  button.disabled=false;
  button.textContent="Kirish";
 }
});

/* PROFILNI TOPISH VA ILОVAGA KIRISH */
async function enterApp(authUser,chosenRole){
 try{
  const {data:authData,error:authError}=await db.auth.getUser();

  if(authError)throw new Error("Auth tekshiruvi xatosi: "+authError.message);

  const currentUser=authData?.user||authUser;
  if(!currentUser?.id)throw new Error("Kirish sessiyasidan foydalanuvchi aniqlanmadi.");

  const {data:p,error:profileError}=await db
   .from("profiles")
   .select("id,full_name,role,username")
   .eq("id",currentUser.id)
   .maybeSingle();

  if(profileError){
   throw new Error("Profilni o'qish xatosi: "+profileError.message+
    (profileError.code?" | Kod: "+profileError.code:""));
  }

  if(!p)throw new Error("Profil topilmadi. Supabase profiles jadvalidagi foydalanuvchi yozuvini tekshiring.");

  const realRole=String(p.role||"").toLowerCase();
  if(!realRole)throw new Error("Profil topildi, lekin role ustuni bo'sh.");

  if(realRole==="admin"){
   const adminCanEnter=["admin","teacher","student"].includes(chosenRole);

   if(!adminCanEnter){
    await db.auth.signOut();
    throw new Error("Administrator ota-ona sifatida kira olmaydi.");
   }
  }else if(realRole!==chosenRole){
   await db.auth.signOut();
   throw new Error("Tanlangan rol bu akkauntga mos emas. Sizning haqiqiy rolingiz: "+roleName(realRole));
  }

  user=currentUser;
  profile=p;
  activeRole=chosenRole;

  $("authScreen").style.display="none";
  $("app").style.display="block";

  $("topName").textContent=profile.full_name||user.email;
  $("topRole").textContent=roleName(activeRole)+
   (realRole==="admin"&&activeRole!=="admin"?" · Admin ko'rinishi":"");

  $("avatar").textContent=(profile.full_name||"E").charAt(0).toUpperCase();

  buildNav();
  await go("dashboard");

 }catch(e){
  user=null;
  profile=null;
  activeRole=null;

  $("app").style.display="none";
  $("authScreen").style.display="grid";

  throw e;
 }
}

/* CHIQISH */
async function logout(){
 if(user?.id&&db){
  const {error:pushError}=await db.from("push_subscriptions").delete().eq("user_id",user.id);
  if(pushError)console.warn("Push obunasini o'chirish:",pushError.message);
 }

 const {error}=await db.auth.signOut();
 if(error)console.error(error);

 user=null;
 profile=null;
 activeRole=null;
 selectedRole=null;
 lastIssued=null;

 $("app").style.display="none";
 $("authScreen").style.display="grid";
 $("loginPanel").classList.add("hidden");
 $("rolePicker").classList.remove("hidden");

 toast("Tizimdan chiqdingiz");
}

/* NAVIGATSIYA */
const baseNav=[
 ["dashboard","⌂","Bosh sahifa"],
 ["courses","▣","Kurslar"],
 ["grades","★","Baholar"],
 ["attendance","✓","Davomat"],
 ["assignments","✎","Uy vazifalari"],
 ["comments","☰","Izohlar"],
 ["messages","✉","Xabarlar"],
 ["schedule","▦","Dars jadvali"],
 ["statistics","▤","Statistika"],
 ["profile","◉","Profil"]
];

function buildNav(){
 let items=[...baseNav];

 if(isTeacher())items.splice(1,0,["accounts","♙","Akkauntlar"]);

 if(isAdmin()){
  items=items.filter(x=>["dashboard","accounts","statistics","profile"].includes(x[0]));
 }

 $("nav").innerHTML=items.map(([id,ico,title])=>
  `<button type="button" data-page="${id}" class="${id===currentPage?"active":""}">${ico} &nbsp; ${title}</button>`
 ).join("");

 $("nav").querySelectorAll("[data-page]").forEach(b=>
  b.addEventListener("click",()=>go(b.dataset.page))
 );
}

function toggleMenu(){
 $("sidebar").classList.toggle("open");
}

async function go(page){
 currentPage=page;
 $("sidebar").classList.remove("open");
 buildNav();

 $("page").innerHTML='<div class="card">Yuklanmoqda...</div>';

 const map={
  dashboard:renderDashboard,
  accounts:renderAccounts,
  courses:renderCourses,
  grades:renderGrades,
  attendance:renderAttendance,
  assignments:renderAssignments,
  comments:renderComments,
  messages:renderMessages,
  schedule:renderSchedule,
  statistics:renderStatistics,
  profile:renderProfile
 };

 try{
  if(!map[page])throw new Error("Bo'lim topilmadi");
  await map[page]();
 }catch(e){
  fail(e);
 }
}

/* BOSH SAHIFA */
async function renderDashboard(){
 const [c,g,a,t]=await Promise.all([
  countRows("courses"),

async function issueAccount(form){
 const f=new FormData(form);

 const body={
  full_name:String(f.get("full_name")||"").trim(),
  username:String(f.get("username")||"").trim().toLowerCase(),
  password:String(f.get("password")||""),
  role:String(f.get("role")||"")
 };

 if(body.full_name.length<2)throw new Error("Ism-familiyani to'liq kiriting.");
 if(body.username.length<3)throw new Error("Login kamida 3 belgidan iborat bo'lsin.");
 if(body.password.length<8)throw new Error("Parol kamida 8 belgidan iborat bo'lsin.");

 if(f.get("course_id"))body.course_id=f.get("course_id");
 if(f.get("student_id"))body.student_id=f.get("student_id");

 const {data,error}=await db.functions.invoke("create-account",{body});

 if(error){
  let msg=error.message;
  try{
   const detail=await error.context.json();
   msg=detail.error||msg;
   if(detail.details)msg+=": "+detail.details;
  }catch{}
  throw new Error(msg);
 }

 if(!data?.success)throw new Error(data?.error||"Akkaunt yaratilmadi");

 lastIssued={
  name:body.full_name,
  username:data.username||body.username,
  password:body.password,
  role:body.role
 };

 toast("Akkaunt muvaffaqiyatli yaratildi");
 await go("accounts");
}

function copyCredentials(){
 if(!lastIssued)return;

 const text=`EduLife login: ${lastIssued.username}\nParol: ${lastIssued.password}\nRol: ${roleName(lastIssued.role)}`;

 if(navigator.clipboard?.writeText){
  navigator.clipboard.writeText(text)
   .then(()=>toast("Login va parol nusxalandi"))
   .catch(()=>toast("Login: "+lastIssued.username+" | Parol: "+lastIssued.password));
 }else{
  toast("Login: "+lastIssued.username+" | Parol: "+lastIssued.password);
 }
}

  .eq("assignment_id",assignment_id)

 const days=["","Dushanba","Seshanba","Chorshanba","Payshanba","Juma","Shanba","Yakshanba"];

 let html=`<div class="page-head"><div><h1>Dars jadvali</h1><p class="muted">Haftalik jadval.</p></div></div>`;

 if(isTeacher()){
  html+=`
  <div class="card"><h3>Dars qo'shish</h3><form id="scheduleForm" class="form-grid">
   ${selectField("course_id","Kurs",own.map(c=>({value:c.id,label:c.title})),"Kursni tanlang")}
   <div><label>Hafta kuni</label><select name="day_of_week">${days.slice(1).map((d,i)=>`<option value="${i+1}">${d}</option>`).join("")}</select></div>
   ${field("start_time","Boshlanish vaqti","","time")}
   ${field("end_time","Tugash vaqti","","time")}
   ${field("room","Xona","Xona raqami")}
   <div class="wide"><button class="btn gold">Saqlash</button></div>
  </form></div>`;
 }

 html+='<div class="list">';

 for(const s of data){
  html+=`<div class="item"><strong>${esc(courseName(s.course_id,cm))}</strong>
   <div>${days[s.day_of_week]||"—"} · ${esc(String(s.start_time||"").slice(0,5))} – ${esc(String(s.end_time||"").slice(0,5))}</div>
   <small>Xona: ${esc(s.room||"—")}</small></div>`;
 }

 html+='</div>';

 $("page").innerHTML=html+(data.length?"":empty("Jadval yo'q"));
}

async function createSchedule(form){
 const f=new FormData(form);

 const {error}=await db.from("lesson_schedule").insert({
  course_id:f.get("course_id"),
  teacher_id:user.id,
  day_of_week:Number(f.get("day_of_week")),
  start_time:f.get("start_time"),
  end_time:f.get("end_time"),
  room:f.get("room").trim()
 });

 if(error)throw error;

 toast("Jadval saqlandi");
 await go("schedule");
}

async function saveProfile(form){
 const name=new FormData(form).get("full_name").trim();

 const {error}=await db.from("profiles")
  .update({full_name:name})
  .eq("id",user.id);

 if(error)throw error;

 profile.full_name=name;
 $("topName").textContent=name;
 $("avatar").textContent=name.charAt(0).toUpperCase();

 toast("Profil yangilandi");
 await go("profile");
}

/* FORM HANDLERS */
const handlers={
 issueTeacherForm:issueAccount,
 issueStudentForm:issueAccount,
 issueParentForm:issueAccount,
 courseForm:createCourse,
 joinForm:joinCourse,
 gradeForm:createGrade,
 attendanceForm:createAttendance,
 assignmentForm:createAssignment,
 commentForm:createComment,
 messageForm:createMessage,
 scheduleForm:createSchedule,
 profileForm:saveProfile
};

document.addEventListener("submit",async e=>{
 const form=e.target;

 if(form.classList.contains("submissionForm")){
  e.preventDefault();
  const button=form.querySelector("button");
  if(button)button.disabled=true;

  try{
   await submitAssignment(form);
  }catch(error){
   fail(error);
  }finally{
   if(button)button.disabled=false;
  }
  return;
 }

 const handler=handlers[form.id];
 if(!handler)return;

 e.preventDefault();

 const button=form.querySelector("button");
 if(button)button.disabled=true;

 try{
  await handler(form);
 }catch(error){
  fail(error);
 }finally{
  if(button)button.disabled=false;
 }
});

  return;
 }

 try{
  db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
   auth:{
    persistSession:true,
    autoRefreshToken:true,
    detectSessionInUrl:false
   }
  });

  $("authScreen").style.display="grid";
  $("app").style.display="none";

 }catch(e){
  fail(e);
 }
}

start();
