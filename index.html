<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080e1b">
<title>EduLife</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://www.gstatic.com/firebasejs/13.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/13.0.0/firebase-messaging-compat.js"></script>

<style>
:root{
 --bg:#080e1b;
 --panel:#101b2d;
 --card:#142239;
 --line:#293a54;
 --blue:#3979f6;
 --gold:#e6c16e;
 --text:#f2f5fb;
 --muted:#9aa9bf;
 --green:#39c58b;
 --red:#ee6878;
 --input-bg:#0a1424;
 --sidebar-bg:#0d1728;
 --topbar-bg:#0d1728;
 --item-bg:#0d192b;
 --nav-text:#b7c4d7;
}

:root[data-theme="light"]{
 color-scheme:light;
 --bg:#f2f5fb;
 --panel:#ffffff;
 --card:#ffffff;
 --line:#dce3ef;
 --blue:#2868db;
 --gold:#a36b00;
 --text:#19263a;
 --muted:#64748b;
 --green:#16875b;
 --red:#cf4055;
 --input-bg:#ffffff;
 --sidebar-bg:#ffffff;
 --topbar-bg:#ffffff;
 --item-bg:#f7f9fd;
 --nav-text:#40516b;
}

:root[data-theme="dark"]{color-scheme:dark}

*{box-sizing:border-box}

body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:Arial,sans-serif;
 transition:background .2s,color .2s;
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

#authScreen{
 min-height:100vh;
 display:grid;
 place-items:center;
 padding:18px;
 background:radial-gradient(circle at top,#20385c,var(--bg) 65%);
}

.auth-card{
 width:100%;
 max-width:470px;
 background:var(--panel);
 border:1px solid var(--line);
 border-radius:22px;
 padding:25px;
 box-shadow:0 20px 70px #0008;
}

.logo{font-size:30px;font-weight:800}
.logo span{color:var(--gold)}

.auth-brand-row{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
}

.auth-sub{
 color:var(--muted);
 line-height:1.5;
 margin:10px 0 24px;
}

.muted{color:var(--muted)}
.field{margin:13px 0}

label{
 display:block;
 margin-bottom:7px;
 font-size:13px;
 color:var(--muted);
}

input,select,textarea{
 width:100%;
 padding:12px;
 background:var(--input-bg);
 color:var(--text);
 border:1px solid var(--line);
 border-radius:10px;
 outline:none;
}

input:focus,select:focus,textarea:focus{border-color:var(--blue)}
textarea{min-height:85px;resize:vertical}

.btn{
 padding:12px 16px;
 border:0;
 border-radius:10px;
 background:var(--blue);
 color:white;
 font-weight:700;
}

.btn.gold{background:var(--gold);color:#172033}
.btn.dark{background:#283a55;color:white}
.btn.red{background:#923746;color:white}
.btn:disabled{opacity:.6;cursor:wait}
.full{width:100%}

.role-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:11px;
 margin:18px 0;
}

.role-choice{
 min-height:105px;
 background:#142943;
 border:1px solid var(--line);
 border-radius:14px;
 color:white;
 padding:14px;
 text-align:center;
}

.role-choice .ico{
 font-size:27px;
 display:block;
 margin-bottom:9px;
}

.role-choice.selected{
 border:2px solid var(--gold);
 background:#24354b;
}

.small-btn{
 background:none;
 border:0;
 color:var(--gold);
 padding:10px 0;
}

.theme-toggle{
 display:inline-flex;
 align-items:center;
 justify-content:center;
 gap:6px;
 padding:9px 12px;
 background:var(--card);
 color:var(--text);
 border:1px solid var(--line);
 border-radius:10px;
 font-size:12px;
 font-weight:700;
 white-space:nowrap;
}

.sidebar{
 width:250px;
 position:fixed;
 inset:0 auto 0 0;
 background:var(--sidebar-bg);
 border-right:1px solid var(--line);
 padding:20px 14px;
 overflow:auto;
 z-index:10;
}

.brand{
 padding:4px 12px 22px;
 border-bottom:1px solid var(--line);
 margin-bottom:14px;
}

.brand small{
 display:block;
 color:var(--muted);
 font-size:10px;
 letter-spacing:2px;
 margin-top:5px;
}

.nav{
 display:flex;
 flex-direction:column;
 gap:5px;
}

.nav button{
 background:none;
 border:0;
 color:var(--nav-text);
 text-align:left;
 padding:12px;
 border-radius:10px;
}

.nav button.active,.nav button:hover{
 background:#1a2d49;
 color:white;
}

.nav button.active{border-left:3px solid var(--gold)}

#app{display:none;min-height:100vh}
.main{margin-left:250px;min-height:100vh}

.topbar{
 height:70px;
 position:sticky;
 top:0;
 z-index:5;
 background:var(--topbar-bg);
 border-bottom:1px solid var(--line);
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 27px;
}

.top-left{
 display:flex;
 align-items:center;
 gap:12px;
}

.top-actions{
 display:flex;
 align-items:center;
 gap:12px;
}

.topbar small{color:var(--muted)}

.avatar{
 width:39px;
 height:39px;
 border-radius:50%;
 background:var(--gold);
 color:#15213a;
 display:grid;
 place-items:center;
 font-weight:bold;
 flex-shrink:0;
}

.menu-btn{
 display:none;
 background:none;
 border:1px solid var(--line);
 color:var(--text);
 border-radius:8px;
 padding:8px 11px;
}

.content{
 max-width:1250px;
 margin:auto;
 padding:27px;
}

.page-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:12px;
 flex-wrap:wrap;
 margin-bottom:20px;
}

.page-head h1{
 font-size:25px;
 margin:0 0 6px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(4,minmax(0,1fr));
 gap:14px;
}

.two{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:14px;
}

.card{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:15px;
 padding:17px;
 margin-bottom:15px;
 min-width:0;
}

.card h3{
 font-size:16px;
 margin:0 0 12px;
}

.card p{
 line-height:1.5;
 color:var(--muted);
}

.stat{
 font-size:29px;
 color:var(--gold);
 font-weight:800;
 margin:10px 0;
}

.form-grid{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:12px;
}

.wide{grid-column:1/-1}

.list{
 display:flex;
 flex-direction:column;
 gap:10px;
}

.item{
 background:var(--item-bg);
 border:1px solid var(--line);
 border-radius:11px;
 padding:13px;
 overflow-wrap:anywhere;
}

.item strong{
 display:block;
 margin-bottom:7px;
}

.item small{color:var(--muted)}

.badge{
 display:inline-block;
 padding:5px 9px;
 border-radius:20px;
 background:#253e62;
 color:#d4e3ff;
 font-size:11px;
}

.badge.gold{background:#4b402b;color:var(--gold)}
.badge.green{background:#164b3b;color:#83e4b9}
.badge.red{background:#512b37;color:#ffabb5}

.empty{
 border:1px dashed var(--line);
 border-radius:12px;
 text-align:center;
 padding:24px;
 color:var(--muted);
}

.notice{
 padding:12px 14px;
 background:#2b2519;
 border:1px solid #705b30;
 color:#f0d58e;
 border-radius:10px;
 line-height:1.5;
 margin:12px 0;
 overflow-wrap:anywhere;
}

.table-wrap{overflow:auto}

table{
 border-collapse:collapse;
 width:100%;
 min-width:450px;
}

td,th{
 text-align:left;
 padding:11px;
 border-bottom:1px solid var(--line);
 font-size:13px;
 vertical-align:top;
}

th{color:var(--gold)}

.price{
 color:var(--gold);
 font-size:25px;
 font-weight:800;
 margin:7px 0;
}

#toast{
 display:none;
 position:fixed;
 z-index:30;
 bottom:20px;
 left:50%;
 transform:translateX(-50%);
 padding:12px 17px;
 background:#223650;
 color:white;
 border:1px solid #4a668e;
 border-radius:12px;
 max-width:90%;
 width:max-content;
 box-shadow:0 8px 30px #0009;
 line-height:1.5;
 overflow-wrap:anywhere;
}

/* LIGHT MODE */
:root[data-theme="light"] #authScreen{
 background:radial-gradient(circle at top,#dceaff,var(--bg) 65%);
}

:root[data-theme="light"] .auth-card{
 box-shadow:0 15px 50px #263b5b18;
}

:root[data-theme="light"] .role-choice{
 background:#f1f5fb;
 color:#20304a;
}

:root[data-theme="light"] .role-choice.selected{
 background:#fff6df;
 border-color:var(--gold);
}

:root[data-theme="light"] .nav button.active,
:root[data-theme="light"] .nav button:hover{
 background:#e9effa;
 color:#19345f;
}

:root[data-theme="light"] .notice{
 background:#fff6df;
 border-color:#e5c778;
 color:#76520c;
}

:root[data-theme="light"] .badge{
 background:#e8effb;
 color:#234d91;
}

:root[data-theme="light"] .badge.gold{
 background:#fff3d5;
 color:#825600;
}

:root[data-theme="light"] .badge.green{
 background:#dcf7e9;
 color:#146c49;
}

:root[data-theme="light"] .badge.red{
 background:#ffe6e9;
 color:#a52d42;
}

:root[data-theme="light"] #toast{
 background:#fff;
 color:#19263a;
 border-color:#dce3ef;
}

:root[data-theme="light"] .btn.dark{
 background:#e1e8f2;
 color:#1b2d48;
}

:root[data-theme="light"] .small-btn{color:#946000}

/* YUTUQLAR */
.achievement-grid{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:14px;
}

.achievement-card{
 background:var(--item-bg);
 border:1px solid var(--line);
 border-radius:15px;
 padding:16px;
 min-width:0;
}

.achievement-card.locked{opacity:.65}

.achievement-icon{
 font-size:38px;
 margin-bottom:10px;
}

.achievement-card h3{
 margin:0 0 7px;
 font-size:16px;
}

.achievement-card p{
 color:var(--muted);
 font-size:13px;
 line-height:1.5;
}

.achievement-progress{
 height:9px;
 background:var(--line);
 border-radius:20px;
 overflow:hidden;
 margin:12px 0 7px;
}

.achievement-progress-fill{
 height:100%;
 background:var(--blue);
 border-radius:20px;
}

.achievement-status{
 font-size:12px;
 font-weight:bold;
 color:var(--gold);
}

.achievement-summary{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:12px;
}

/* STATISTIKA */
.stats-overview{
 display:grid;
 grid-template-columns:repeat(3,minmax(0,1fr));
 gap:12px;
 margin-bottom:16px;
}

.stats-box{
 background:var(--item-bg);
 border:1px solid var(--line);
 border-radius:13px;
 padding:15px;
 min-width:0;
}

.stats-box .number{
 font-size:27px;
 font-weight:800;
 color:var(--gold);
 margin-top:9px;
 overflow-wrap:anywhere;
}

.stats-box small{color:var(--muted)}

.stats-course{
 background:var(--item-bg);
 border:1px solid var(--line);
 border-radius:13px;
 padding:16px;
 margin-bottom:12px;
}

.stats-course-title{
 display:flex;
 justify-content:space-between;
 align-items:center;
 flex-wrap:wrap;
 gap:10px;
 margin-bottom:13px;
}

.stats-course-title h3{
 margin:0;
 font-size:16px;
}

.stats-row{
 display:grid;
 grid-template-columns:75px minmax(0,1fr) 45px;
 gap:9px;
 align-items:center;
 margin:12px 0;
 font-size:12px;
}

.stats-track{
 background:var(--line);
 height:12px;
 border-radius:20px;
 overflow:hidden;
}

.stats-fill{
 height:100%;
 border-radius:20px;
 background:var(--blue);
}

.stats-fill.old{background:#8492a8}

.stats-change{
 padding:7px 10px;
 border-radius:8px;
 display:inline-block;
 font-size:12px;
 font-weight:bold;
}

.stats-change.up{background:#164b3b;color:#83e4b9}
.stats-change.down{background:#512b37;color:#ffabb5}
.stats-change.same{background:#253e62;color:#d4e3ff}

.stats-hint{
 font-size:12px;
 color:var(--muted);
 line-height:1.6;
}

.stats-section-title{
 margin:22px 0 13px;
 font-size:18px;
}

.stats-empty{
 border:1px dashed var(--line);
 border-radius:12px;
 padding:18px;
 color:var(--muted);
 text-align:center;
}

/* PDF */
@media(max-width:950px){
 .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

@media(max-width:700px){
 .sidebar{
  transform:translateX(-105%);
  transition:.25s;
  width:260px;
  box-shadow:12px 0 35px #0009;
 }

 .sidebar.open{transform:translateX(0)}
 .main{margin-left:0}
 .menu-btn{display:block}

 .topbar{
  height:62px;
  padding:0 13px;
 }

 .content{padding:18px 13px}
 .two{grid-template-columns:1fr}
 .card{padding:14px}
 .page-head h1{font-size:22px}
 .theme-toggle{padding:8px;font-size:11px}
 .top-actions{gap:7px}
}

@media(max-width:600px){
 .stats-overview{grid-template-columns:repeat(2,minmax(0,1fr))}
 .stats-row{grid-template-columns:60px minmax(0,1fr) 40px;gap:6px}
}

@media(max-width:450px){
 .achievement-grid{grid-template-columns:1fr}
}

@media(max-width:390px){
 .grid,.form-grid{grid-template-columns:1fr}
 .wide{grid-column:auto}
 .topbar{padding:0 9px}
 .top-left{gap:7px}
 .topbar strong{font-size:14px}
 .theme-toggle{font-size:10px;padding:7px}
 .avatar{width:34px;height:34px}
}
</style>
</head>

<script>
/* SOZLAMALAR */

const SUPABASE_URL="https://nqunhvbiiukqfswsntpf.supabase.co";
const SUPABASE_KEY="sb_publishable_M7rhjIqZ8rFNxUKurGb4pQ_A6MF0Get";

const FIREBASE_CONFIG={
 apiKey:"AIzaSyD1hJsCmk_7AfhnFA-jjwK4CA1pFnHA7Ks",
 authDomain:"edulife-a774f.firebaseapp.com",
 projectId:"edulife-a774f",
 storageBucket:"edulife-a774f.firebasestorage.app",
 messagingSenderId:"92661505128",
 appId:"1:92661505128:web:7aeb0cbcb25bed59ceefdd"
};

const FIREBASE_VAPID_KEY="BOT0xJybOmDsY70AZb_uMbBQKweon9npPcmE9Ng8HwMBqN5JvXILBN9K2lrONI1hr92PHX4G6_6DjdN3N3AStZwE";

let db=null,user=null,profile=null;
let selectedRole=null,activeRole=null,currentPage="dashboard",lastIssued=null;
let firebaseMessaging=null;
let firebaseForegroundListenerAdded=false;

const $=id=>document.getElementById(id);

/* DARK MODE */

function applyTheme(theme){

 const selected=theme==="light"?"light":"dark";

 document.documentElement.setAttribute("data-theme",selected);

 try{
  localStorage.setItem("edulife_theme",selected);
 }catch(e){
  console.warn("Rejimni saqlab bo'lmadi:",e);
 }

 document.querySelectorAll(".theme-toggle").forEach(button=>{
  button.textContent=selected==="dark"
   ?"☀️ Yorug‘ rejim"
   :"🌙 Qorong‘i rejim";
 });

 const meta=document.querySelector('meta[name="theme-color"]');

 if(meta){
  meta.content=selected==="dark"?"#080e1b":"#f2f5fb";
 }
}

function toggleTheme(){

 const current=document.documentElement.getAttribute("data-theme")||"dark";
 const next=current==="dark"?"light":"dark";

 applyTheme(next);

 toast(next==="light"
  ?"☀️ Yorug‘ rejim yoqildi"
  :"🌙 Qorong‘i rejim yoqildi"
 );
}

function loadTheme(){

 try{
  const saved=localStorage.getItem("edulife_theme");
  applyTheme(saved||"dark");
 }catch(e){
  applyTheme("dark");
 }

}

loadTheme();

/* YORDAMCHI FUNKSIYALAR */

function esc(v){

 return String(v??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[c]));

}

function toast(msg){

 const el=$("toast");

 el.textContent=msg;
 el.style.display="block";

 clearTimeout(window.toastTimer);

 window.toastTimer=setTimeout(
  ()=>el.style.display="none",
  10000
 );

}

function fail(e){

 console.error("EduLife xatoligi:",e);
 toast(e?.message||"Xatolik yuz berdi");

}

function roleName(r){

 return ({
  student:"O'quvchi",
  teacher:"Ustoz",
  parent:"Ota-ona",
  admin:"Administrator"
 })[r]||r||"Foydalanuvchi";

}

function dateText(v){

 return v
  ?new Date(v).toLocaleString("uz-UZ",{dateStyle:"medium",timeStyle:"short"})
  :"—";

}

function empty(v="Hozircha ma'lumot yo'q"){

 return `<div class="empty">${esc(v)}</div>`;

}

function makeNameMap(people){

 return Object.fromEntries((people||[]).map(p=>[
  p.id,
  p.full_name||roleName(p.role)
 ]));

}

function personName(id,map){

 if(!id)return "—";

 return map?.[id]||"Foydalanuvchi";

}

function makeCourseMap(courses){

 return Object.fromEntries((courses||[]).map(c=>[
  c.id,c.title||"Kurs"
 ]));

}

function courseName(id,map){

 if(!id)return "—";

 return map?.[id]||"Kurs nomi topilmadi";

}

function isTeacher(){

 return activeRole==="teacher"||activeRole==="admin";

}

function isAdmin(){

 return activeRole==="admin";

}

async function rows(table,columns="*"){

 const {data,error}=await db.from(table).select(columns);

 if(error)throw error;

 return data||[];

}

async function countRows(table){

 const {count,error}=await db
  .from(table)
  .select("*",{count:"exact",head:true});

 if(error)throw error;

 return count||0;

}

function statCard(title,value,icon){

 return `<div class="card">
  <div class="muted">${icon} ${esc(title)}</div>
  <div class="stat">${value}</div>
 </div>`;

}

function field(name,label,placeholder="",type="text"){

 return `<div>
  <label>${esc(label)}</label>
  <input name="${esc(name)}" type="${esc(type)}" placeholder="${esc(placeholder)}" required>
 </div>`;

}

function selectField(name,label,items,placeholder){

 return `<div>
  <label>${esc(label)}</label>

/* FIREBASE PUSH */

function pushPermissionText(){

 if(!("Notification" in window))
  return "Bu brauzer bildirishnomalarni qo'llab-quvvatlamaydi.";

 if(Notification.permission==="granted")
  return "Brauzer ruxsati berilgan. Bildirishnomalarni ro'yxatdan o'tkazish mumkin.";

 if(Notification.permission==="denied")
  return "Brauzerda bildirishnomaga ruxsat rad etilgan. Sayt sozlamalaridan ruxsat bering.";

 return "Telefon bildirishnomalarini yoqish uchun tugmani bosing.";

}

async function getFirebaseMessaging(){

 if(!window.firebase||!firebase.messaging){
  throw new Error("Firebase kutubxonasi yuklanmadi. Internetni tekshiring.");
 }

 const supported=await firebase.messaging.isSupported();

 if(!supported){
  throw new Error("Bu brauzer Firebase push bildirishnomalarini qo'llab-quvvatlamaydi.");
 }

 if(!firebase.apps.length){
  firebase.initializeApp(FIREBASE_CONFIG);
 }

 firebaseMessaging=firebase.messaging();

 if(!firebaseForegroundListenerAdded){

  firebaseMessaging.onMessage(payload=>{

   const title=payload?.notification?.title||payload?.data?.title||"EduLife";
   const body=payload?.notification?.body||payload?.data?.body||"Yangi bildirishnoma keldi.";

   toast("🔔 "+title+" — "+body);

  });

  firebaseForegroundListenerAdded=true;
 }

 return firebaseMessaging;

}

async function enablePushNotifications(){

 const button=$("enablePushBtn");
 const status=$("pushStatus");

 if(button){
  button.disabled=true;
  button.textContent="Ulanmoqda...";
 }

 try{

  if(!user||!db)throw new Error("Avval EduLife akkauntingizga kiring.");

  if(!window.isSecureContext)
   throw new Error("Bildirishnomalar uchun sayt HTTPS manzilda ochilishi kerak.");

  if(!("serviceWorker" in navigator))
   throw new Error("Bu brauzer Service Worker xizmatini qo'llab-quvvatlamaydi.");

  if(!("Notification" in window))
   throw new Error("Bu brauzer Notification xizmatini qo'llab-quvvatlamaydi.");

  if(Notification.permission==="denied")
   throw new Error("Bildirishnomaga ruxsat avval rad etilgan. Chrome sayt sozlamalaridan Notifications → Allow qiling.");

  const permission=Notification.permission==="granted"
   ?"granted"
   :await Notification.requestPermission();

  if(permission!=="granted")
   throw new Error("Bildirishnomaga ruxsat berilmadi.");

  const registration=await navigator.serviceWorker.register(
   "/firebase-messaging-sw.js",
   {scope:"/"}
  );

  await navigator.serviceWorker.ready;

  const messaging=await getFirebaseMessaging();

  const token=await messaging.getToken({
   vapidKey:FIREBASE_VAPID_KEY,
   serviceWorkerRegistration:registration
  });

  if(!token)throw new Error("Firebase qurilma tokenini qaytarmadi.");

  const {error}=await db.from("push_subscriptions").upsert({
   user_id:user.id,
   token,
   updated_at:new Date().toISOString()
  },{onConflict:"user_id,token"});

  if(error)throw new Error("Token Supabase'ga saqlanmadi: "+error.message);

  if(status){
   status.textContent="✅ Telefon bildirishnomalari yoqildi va akkauntingizga bog'landi.";
  }

  toast("✅ EduLife bildirishnomalari yoqildi!");

 }catch(e){

  if(status){
   status.textContent=e?.message||"Bildirishnomani yoqishda xatolik yuz berdi.";
  }

  fail(e);

 }finally{

  if(button){
   button.disabled=false;
   button.textContent="🔔 Bildirishnomalarni yoqish";
  }

 }

}

async function enterApp(authUser,chosenRole){

 try{

  const {data:authData,error:authError}=await db.auth.getUser();

  if(authError){
   throw new Error("Auth tekshiruvi xatosi: "+authError.message);
  }

  const currentUser=authData?.user||authUser;

  if(!currentUser?.id){
   throw new Error("Kirish sessiyasidan foydalanuvchi aniqlanmadi.");
  }

  const {data:p,error:profileError}=await db
   .from("profiles")
   .select("id,full_name,role,username")
   .eq("id",currentUser.id)
   .maybeSingle();

  if(profileError){

   throw new Error(
    "Profilni o'qish xatosi: "+profileError.message+
    (profileError.code?" | Kod: "+profileError.code:"")
   );

  }

  if(!p){
   throw new Error("Profil topilmadi. Supabase profiles jadvalidagi foydalanuvchi yozuvini tekshiring.");
  }

  const realRole=String(p.role||"").toLowerCase();

  if(!realRole){
   throw new Error("Profil topildi, lekin role ustuni bo'sh.");
  }

  if(realRole==="admin"){

   const adminCanEnter=["admin","teacher","student"].includes(chosenRole);

   if(!adminCanEnter){
    await db.auth.signOut();
    throw new Error("Administrator ota-ona sifatida kira olmaydi.");
   }

  }else if(realRole!==chosenRole){

   await db.auth.signOut();

   throw new Error(
    "Tanlangan rol bu akkauntga mos emas. Sizning haqiqiy rolingiz: "+
    roleName(realRole)
   );

  }

  user=currentUser;
  profile=p;
  activeRole=chosenRole;

  $("authScreen").style.display="none";
  $("app").style.display="block";

  $("topName").textContent=profile.full_name||user.email;

  $("topRole").textContent=roleName(activeRole)+
   (realRole==="admin"&&activeRole!=="admin"?" · Admin ko'rinishi":"");

  $("avatar").textContent=(profile.full_name||"E").charAt(0).toUpperCase();

  buildNav();

  await go("dashboard");

 }catch(e){

  user=null;
  profile=null;
  activeRole=null;

  $("app").style.display="none";
  $("authScreen").style.display="grid";

  throw e;

 }

}

async function issueAccount(form){

 const f=new FormData(form);

 const body={
  full_name:String(f.get("full_name")||"").trim(),
  username:String(f.get("username")||"").trim().toLowerCase(),
  password:String(f.get("password")||""),
  role:String(f.get("role")||"")
 };

 if(body.full_name.length<2)
  throw new Error("Ism-familiyani to'liq kiriting.");

 if(body.username.length<3)
  throw new Error("Login kamida 3 belgidan iborat bo'lsin.");

 if(body.password.length<8)
  throw new Error("Parol kamida 8 belgidan iborat bo'lsin.");

 if(f.get("course_id"))body.course_id=f.get("course_id");
 if(f.get("student_id"))body.student_id=f.get("student_id");

 const {data,error}=await db.functions.invoke("create-account",{body});

 if(error){

  let msg=error.message;

  try{
   const detail=await error.context.json();
   msg=detail.error||msg;
   if(detail.details)msg+=": "+detail.details;
  }catch{}

  throw new Error(msg);

 }

 if(!data?.success){
  throw new Error(data?.error||"Akkaunt yaratilmadi");
 }

 lastIssued={
  name:body.full_name,
  username:data.username||body.username,
  password:body.password,
  role:body.role
 };

 toast("Akkaunt muvaffaqiyatli yaratildi");

 await go("accounts");

}

/* STATISTIKA */

function average(values){

 if(!values.length)return 0;

 return values.reduce((a,b)=>a+b,0)/values.length;

}

function percent(value){

 return Math.max(0,Math.min(100,value));

}

function gradeTrend(values){

 const sorted=[...values].sort((a,b)=>
  new Date(a.created_at||0)-new Date(b.created_at||0)
 );

 if(sorted.length<2){

  return {
   enough:false,
   current:average(sorted.map(x=>Number(x.grade)||0)),
   first:0,
   latest:0,
   change:0
  };

 }

 const middle=Math.ceil(sorted.length/2);

 const first=sorted.slice(0,middle);
 const latest=sorted.slice(middle);

 const firstAvg=average(first.map(x=>Number(x.grade)||0));
 const latestAvg=average(latest.map(x=>Number(x.grade)||0));

 return {
  enough:true,
  first:firstAvg,
  latest:latestAvg,
  change:latestAvg-firstAvg,
  current:average(sorted.map(x=>Number(x.grade)||0))
 };

}

function trendLabel(change){

 if(change>0.1){
  return `<span class="stats-change up">↗ Yaxshilangan +${change.toFixed(1)}</span>`;
 }

 if(change< -0.1){
  return `<span class="stats-change down">↘ Pasaygan ${change.toFixed(1)}</span>`;
 }

 return `<span class="stats-change same">→ Barqaror</span>`;

}

function courseChart(course,grades){

 const trend=gradeTrend(grades);

 return `
 <div class="stats-course">

  <div class="stats-course-title">
   <h3>📘 ${esc(course.title||"Kurs")}</h3>
   ${
    trend.enough
     ?trendLabel(trend.change)
     :'<span class="badge">Yangi natija</span>'
   }
  </div>

  ${
   trend.enough
   ?`
    <div class="stats-row">
     <span>Avval</span>
     <div class="stats-track">
      <div class="stats-fill old" style="width:${percent(trend.first)}%"></div>
     </div>
     <b>${trend.first.toFixed(1)}</b>
    </div>

    <div class="stats-row">
     <span>Keyin</span>
     <div class="stats-track">
      <div class="stats-fill" style="width:${percent(trend.latest)}%"></div>
     </div>
     <b>${trend.latest.toFixed(1)}</b>
    </div>
   `
   :`
    <div class="stats-row">
     <span>Natija</span>
     <div class="stats-track">
      <div class="stats-fill" style="width:${percent(trend.current)}%"></div>
     </div>
     <b>${trend.current.toFixed(1)}</b>
    </div>

    <p class="stats-hint">
     O‘zgarishni aniqlash uchun yana kamida bitta baho kerak.
    </p>
   `
  }

  <div class="stats-hint">
   Jami baholar: ${grades.length} ta · O‘rtacha: ${trend.current.toFixed(1)}
  </div>

 </div>`;

}

async function readStudentAchievements(studentId){

 const [gradesResult,attendanceResult,submissionsResult]=await Promise.all([

  db.from("grades")
   .select("id,grade")
   .eq("student_id",studentId),

  db.from("attendance")
   .select("id,status")
   .eq("student_id",studentId),

  db.from("submissions")
   .select("id")
   .eq("student_id",studentId)

 ]);

 if(gradesResult.error)throw gradesResult.error;
 if(attendanceResult.error)throw attendanceResult.error;
 if(submissionsResult.error)throw submissionsResult.error;

 const grades=gradesResult.data||[];
 const attendance=attendanceResult.data||[];
 const submissions=submissionsResult.data||[];

 const numbers=grades
  .map(g=>Number(g.grade))
  .filter(n=>Number.isFinite(n));

 const averageGrade=numbers.length
  ?numbers.reduce((a,b)=>a+b,0)/numbers.length
  :0;

 const present=attendance.filter(a=>a.status==="present").length;

 const attendanceRate=attendance.length
  ?present/attendance.length*100
  :0;

 const taskCount=submissions.length;

 const definitions=[

  {
   icon:"⭐",
   title:"Birinchi baho",
   description:"Birinchi bahongni olganing uchun.",
   unlocked:grades.length>=1,
   progress:Math.min(grades.length,1),
   progressText:Math.min(grades.length,1)+"/1 baho"
  },

  {
   icon:"🧠",
   title:"Bilimdon",
   description:"Kamida 3 ta baho va 85 yoki undan yuqori o‘rtacha natija.",
   unlocked:grades.length>=3&&averageGrade>=85,
   progress:grades.length<3
    ?grades.length/3
    :Math.min(averageGrade/85,1),
   progressText:grades.length+"/3 baho · O‘rtacha "+averageGrade.toFixed(1)
  },

  {
   icon:"🏆",
   title:"A'lochi",
   description:"Kamida bitta 95 yoki undan yuqori baho olish.",
   unlocked:numbers.some(n=>n>=95),
   progress:numbers.some(n=>n>=95)?1:0,
   progressText:numbers.some(n=>n>=95)?"Bajarildi":"95+ baho kutilmoqda"
  },

  {
   icon:"🔥",
   title:"Faol o‘quvchi",
   description:"Kamida 5 marta darsga kelish.",
   unlocked:present>=5,
   progress:Math.min(present/5,1),
   progressText:present+"/5 kelgan dars"
  },

  {
   icon:"🎖️",
   title:"Intizomli",
   description:"Kamida 5 ta davomat yozuvi va 90% qatnashuv.",
   unlocked:attendance.length>=5&&attendanceRate>=90,
   progress:attendance.length<5
    ?attendance.length/5
    :Math.min(attendanceRate/90,1),
   progressText:attendance.length+"/5 yozuv · "+attendanceRate.toFixed(0)+"%"
  },

  {
   icon:"📚",
   title:"Vazifalarni bajaruvchi",
   description:"Birinchi uy vazifasini yuborish.",
   unlocked:taskCount>=1,
   progress:Math.min(taskCount,1),
   progressText:Math.min(taskCount,1)+"/1 vazifa"
  },

  {
   icon:"💪",
   title:"Mehnatkash",
   description:"Kamida 5 ta uy vazifasini yuborish.",
   unlocked:taskCount>=5,
   progress:Math.min(taskCount/5,1),
   progressText:taskCount+"/5 vazifa"
  }

 ];

 return {
  grades:grades.length,
  average:averageGrade,
  attendance:attendance.length,
  present,
  tasks:taskCount,
  unlocked:definitions.filter(x=>x.unlocked).length,
  badges:definitions
 };

}

function achievementCard(b){

 const progress=Math.max(0,Math.min(100,b.progress*100));

 return `
 <div class="achievement-card ${b.unlocked?"":"locked"}">

  <div class="achievement-icon">
   ${b.unlocked?b.icon:"🔒"}
  </div>

  <h3>${esc(b.title)}</h3>

  <p>${esc(b.description)}</p>

  <div class="achievement-progress">
   <div class="achievement-progress-fill" style="width:${progress}%"></div>
  </div>

  <div class="achievement-status">
   ${b.unlocked?"✅ Ochildi":"🔒 "+esc(b.progressText)}
  </div>

 </div>`;

}

function pdfDate(value){

 if(!value)return "—";

 const date=new Date(value);

 if(Number.isNaN(date.getTime()))return "—";

 return date.toLocaleDateString("uz-UZ");

}

function pdfAverage(items){

 const values=items
  .map(x=>Number(x.grade))
  .filter(x=>Number.isFinite(x));

 return values.length
  ?values.reduce((a,b)=>a+b,0)/values.length
  :0;

}

function gradeTypeName(value){

 return ({
  daily:"Kundalik",
  exam:"Imtihon",
  course:"Kurs"
 })[value]||value||"—";

}

async function getReportStudents(){

 if(activeRole==="student"){

  return [{
   id:user.id,
   name:profile.full_name||"O‘quvchi"
  }];

 }

 if(activeRole==="parent"){

  const {data:links,error}=await db
   .from("parent_student_links")
   .select("student_id")
   .eq("parent_id",user.id);

  if(error)throw error;

  const ids=[...new Set(
   (links||[]).map(x=>x.student_id).filter(Boolean)
  )];

  if(!ids.length)return [];

  const {data,error:peopleError}=await db
   .from("profiles")
   .select("id,full_name")
   .in("id",ids);

  if(peopleError)throw peopleError;

  return (data||[]).map(p=>({
   id:p.id,
   name:p.full_name||"O‘quvchi"
  }));

 }

 if(activeRole==="teacher"){

  const {data:courses,error}=await db
   .from("courses")
   .select("id")
   .eq("teacher_id",user.id);

  if(error)throw error;

  const courseIds=(courses||[]).map(c=>c.id);

  if(!courseIds.length)return [];

  const {data:enrollments,error:enrollmentError}=await db
   .from("course_enrollments")
   .select("student_id")
   .in("course_id",courseIds);

  if(enrollmentError)throw enrollmentError;

  const ids=[...new Set(
   (enrollments||[]).map(x=>x.student_id).filter(Boolean)
  )];

  if(!ids.length)return [];

  const {data,error:peopleError}=await db
   .from("profiles")
   .select("id,full_name")
   .in("id",ids);

  if(peopleError)throw peopleError;

  return (people||[]).map(p=>({
   id:p.id,
   name:p.full_name||"O‘quvchi"
  }));

 }

 if(activeRole==="admin"){

  const {data,error}=await db
   .from("profiles")
   .select("id,full_name")
   .eq("role","student");

  if(error)throw error;

  return (data||[]).map(p=>({
   id:p.id,
   name:p.full_name||"O‘quvchi"
  }));

 }

 return [];

}

/* SANA */

function calKey(value){

 const d=new Date(value);

 return d.getFullYear()+"-"+
  String(d.getMonth()+1).padStart(2,"0")+"-"+
  String(d.getDate()).padStart(2,"0");

}

function calLocalDate(key,time="15:00"){

 const [y,m,d]=key.split("-").map(Number);
 const [h,min]=time.split(":").map(Number);

 return new Date(y,m-1,d,h||0,min||0);

}

function calTypeName(type){

 return {
  exam:"Imtihon",
  test:"Nazorat ishi",
  homework:"Uy vazifasi",
  reminder:"Eslatma",
  lesson:"Dars"
 }[type]||"Tadbir";

}

function calIcon(type){

 return {
  exam:"🎓",
  test:"📝",
  homework:"📚",
  reminder:"🔔",
  lesson:"🏫"
 }[type]||"📅";

}

function calDateText(key){

 return calLocalDate(key).toLocaleDateString("uz-UZ",{
  weekday:"long",
  day:"numeric",
  month:"long",
  year:"numeric"
 });

}

function calTimeText(value){

 if(!value)return "Vaqt belgilanmagan";

 const d=new Date(value);

 if(Number.isNaN(d.getTime()))return "—";

 return d.toLocaleTimeString("uz-UZ",{
  hour:"2-digit",
  minute:"2-digit"
 });

}

/* KURS VA FOYDALANUVCHI DOIRASI */

async function calGetCourses(){

 let result;

 if(activeRole==="admin"){

  result=await db
   .from("courses")
   .select("id,title,teacher_id");

 }else if(activeRole==="teacher"){

  result=await db
   .from("courses")
   .select("id,title,teacher_id")
   .eq("teacher_id",user.id);

 }else{

  const {data,error}=await db.rpc(
   "edulife_calendar_course_ids"
  );

  if(error)throw error;

  const ids=[...new Set(
   (data||[]).map(x=>x.course_id).filter(Boolean)
  )];

  if(!ids.length)return [];

  result=await db
   .from("courses")
   .select("id,title,teacher_id")
   .in("id",ids);

 }

 if(result.error)throw result.error;

 return result.data||[];

}

/* MA'LUMOTLARNI YUKLASH */

async function calLoadData(){

 calLoaded=false;
 calEvents=[];
 calCourses=[];

 const courses=await calGetCourses();

 calCourses=courses;

 const ids=courses.map(c=>c.id);

 if(!ids.length){
  calLoaded=true;
  return;
 }

 const [assignResult,eventResult,scheduleResult]=
  await Promise.all([

   db.from("assignments")
    .select("id,course_id,title,description,due_at")
    .in("course_id",ids)
    .not("due_at","is",null),

   db.from("calendar_events")
    .select("id,course_id,title,description,event_type,event_date")
    .in("course_id",ids),

   db.from("lesson_schedule")
    .select("id,course_id,day_of_week,start_time,end_time,room")
    .in("course_id",ids)

  ]);

 if(assignResult.error)throw assignResult.error;
 if(eventResult.error)throw eventResult.error;
 if(scheduleResult.error)throw scheduleResult.error;

 const courseNames=Object.fromEntries(
  courses.map(c=>[c.id,c.title||"Kurs"])
 );

 const events=[];

 /* UY VAZIFALARI */

 for(const a of assignResult.data||[]){

  events.push({
   id:"assignment-"+a.id,
   course_id:a.course_id,
   course_name:courseNames[a.course_id]||"Kurs",
   title:a.title,
   description:a.description||"",
   date:a.due_at,
   type:"homework"
  });

 }

 /* NAZORAT, IMTIHON VA ESLATMALAR */

 for(const e of eventResult.data||[]){

  events.push({
   id:"event-"+e.id,
   course_id:e.course_id,
   course_name:courseNames[e.course_id]||"Kurs",
   title:e.title,
   description:e.description||"",
   date:e.event_date,
   type:e.event_type
  });

 }

 /* TAKRORLANADIGAN HAFTALIK DARSLAR */

 const firstDay=new Date(
  calMonth.getFullYear(),
  calMonth.getMonth(),
  1
 );

 const weekday=(firstDay.getDay()+6)%7;

 const gridStart=new Date(firstDay);
 gridStart.setDate(firstDay.getDate()-weekday);

 for(const s of scheduleResult.data||[]){

  for(let i=0;i<42;i++){

   const day=new Date(gridStart);
   day.setDate(gridStart.getDate()+i);

   const weekDay=(day.getDay()+6)%7+1;

   if(weekDay!==Number(s.day_of_week))continue;

   const time=String(s.start_time||"09:00").slice(0,5);
   const [hour,minute]=time.split(":").map(Number);

   day.setHours(hour||0,minute||0,0,0);

   events.push({
    id:"lesson-"+s.id+"-"+calKey(day),
    course_id:s.course_id,
    course_name:courseNames[s.course_id]||"Kurs",
    title:"Dars: "+(courseNames[s.course_id]||"Kurs"),
    description:"Xona: "+(s.room||"—")+
     " · Tugash: "+String(s.end_time||"").slice(0,5),
    date:day.toISOString(),
    type:"lesson"
   });

  }

 }

 calEvents=events.filter(e=>{
  const d=new Date(e.date);
  return !Number.isNaN(d.getTime());
 });

 calEvents.sort((a,b)=>
  new Date(a.date)-new Date(b.date)
 );

 calLoaded=true;

}

/* KALENDAR CHIZISH */

function calDraw(){

 const page=$("page");

 const year=calMonth.getFullYear();
 const month=calMonth.getMonth();

 const monthName=calMonth.toLocaleDateString("uz-UZ",{
  month:"long",
  year:"numeric"
 });

 const first=new Date(year,month,1);
 const offset=(first.getDay()+6)%7;

 const start=new Date(year,month,1-offset);

 const todayKey=calKey(new Date());

 let cells="";

 for(let i=0;i<42;i++){

  const day=new Date(start);
  day.setDate(start.getDate()+i);

  const key=calKey(day);

  const dayEvents=calEvents.filter(e=>
   calKey(e.date)===key
  );

  const outside=day.getMonth()!==month;
  const selected=key===calSelected;
  const today=key===todayKey;

  const dots=dayEvents.slice(0,4).map(e=>
   `<span class="calendar-dot ${esc(e.type)}"></span>`
  ).join("");

  cells+=`
   <button type="button"
    class="calendar-day ${outside?"outside":""} ${selected?"selected":""} ${today?"today":""}"
    data-cal-day="${key}">

    <div class="calendar-day-number">${day.getDate()}</div>

    <div class="calendar-dots">
     ${dots}
    </div>

   </button>`;

 }

 const selectedEvents=calEvents.filter(e=>
  calKey(e.date)===calSelected
 );

 let eventHtml="";

 if(selectedEvents.length){

  eventHtml=selectedEvents.map(e=>`

   <div class="calendar-event">

    <div class="calendar-event-icon">
     ${calIcon(e.type)}
    </div>

    <div class="calendar-event-content">

     <strong>${esc(e.title)}</strong>

     <div class="calendar-event-time">
      ${esc(e.course_name)}
      · ${calTimeText(e.date)}
     </div>

     ${e.description
      ?`<p>${esc(e.description)}</p>`
      :""
     }

     <span class="calendar-type">
      ${calTypeName(e.type)}
     </span>

    </div>

   </div>

  `).join("");

 }else{

  eventHtml=`<div class="calendar-empty">
   Bu sanada rejalashtirilgan tadbir yo‘q.
  </div>`;

 }

 let createForm="";

 if(isTeacher()){

  createForm=`
  <div class="card">
   <h3>➕ Yangi tadbir qo‘shish</h3>

   <form id="calendarEventForm">

    <div class="form-grid">

     <div>
      <label>Kurs</label>
      <select name="course_id" required>
       <option value="">Kursni tanlang</option>
       ${calCourses.map(c=>
        `<option value="${esc(c.id)}">${esc(c.title)}</option>`
       ).join("")}
      </select>
     </div>

     <div>
      <label>Tadbir turi</label>
      <select name="event_type">
       <option value="test">📝 Nazorat ishi</option>
       <option value="exam">🎓 Imtihon</option>
       <option value="reminder">🔔 Eslatma</option>
      </select>
     </div>

     <div class="wide">
      <label>Tadbir nomi</label>
      <input name="title" required maxlength="150"
       placeholder="Masalan: Matematika nazorat ishi">
     </div>

     <div class="wide">
      <label>Sana va vaqt</label>
      <input name="event_date" type="datetime-local"
       value="${calSelected}T15:00" required>
     </div>

     <div class="wide">
      <label>Izoh</label>
      <textarea name="description"
       placeholder="Qo‘shimcha ma’lumot..."></textarea>
     </div>

     <div class="wide">
      <button type="submit" class="btn gold full">
       Tadbirni kalendarga qo‘shish
      </button>
     </div>

    </div>

   </form>
  </div>`;

 }

 page.innerHTML=`

  <div class="page-head">
   <div>
    <h1>📅 Aqlli kalendar</h1>
    <p class="muted">
     Darslar, uy vazifalari, nazorat va imtihonlar.
    </p>
   </div>

   <span class="badge gold">
    ${calEvents.length} ta sana
   </span>
  </div>

  ${createForm}

  <div class="card">

   <div class="calendar-toolbar">

    <div class="calendar-month">${esc(monthName)}</div>

    <div class="calendar-actions">

     <button type="button" data-cal-action="prev">‹</button>
     <button type="button" data-cal-action="today">Bugun</button>
     <button type="button" data-cal-action="next">›</button>

    </div>

   </div>

   <div class="calendar-grid">

    ${["Du","Se","Ch","Pa","Ju","Sh","Ya"].map(d=>
     `<div class="calendar-weekday">${d}</div>`
    ).join("")}

    ${cells}

   </div>

   <div class="calendar-legend">
    <span><i class="calendar-dot homework"></i>Vazifa</span>
    <span><i class="calendar-dot test"></i>Nazorat</span>
    <span><i class="calendar-dot exam"></i>Imtihon</span>
    <span><i class="calendar-dot reminder"></i>Eslatma</span>
    <span><i class="calendar-dot lesson"></i>Dars</span>
   </div>

  </div>

  <div class="card">

   <h3>📌 ${esc(calDateText(calSelected))}</h3>

   ${eventHtml}

  </div>

 `;

 /* SANA TANLASH */

 page.querySelectorAll("[data-cal-day]").forEach(button=>{

  button.addEventListener("click",()=>{

   calSelected=button.dataset.calDay;

   calDraw();

  });

 });

 /* OY ALMASHTIRISH */

 page.querySelectorAll("[data-cal-action]").forEach(button=>{

  button.addEventListener("click",()=>{

   const action=button.dataset.calAction;

   if(action==="prev"){

    calMonth.setMonth(calMonth.getMonth()-1);

    calSelected=calKey(calMonth);

   }else if(action==="next"){

    calMonth.setMonth(calMonth.getMonth()+1);

    calSelected=calKey(calMonth);

   }else{

    const now=new Date();

    calMonth=new Date(now.getFullYear(),now.getMonth(),1);
    calSelected=calKey(now);

   }

   calLoadData().then(calDraw).catch(fail);

  });

 });

 /* YANGI TADBIR */

 const form=$("calendarEventForm");

 if(form){

  form.addEventListener("submit",async e=>{

   e.preventDefault();

   const button=form.querySelector('button[type="submit"]');

   button.disabled=true;
   button.textContent="Saqlanmoqda...";

   try{

    const f=new FormData(form);

    const title=String(f.get("title")||"").trim();
    const date=String(f.get("event_date")||"");

    if(!title)throw new Error("Tadbir nomini kiriting.");

    if(!date)throw new Error("Sana va vaqtni tanlang.");

    const eventDate=new Date(date);

    if(Number.isNaN(eventDate.getTime())){
     throw new Error("Sana noto‘g‘ri.");
    }

    const {error}=await db.from("calendar_events").insert({

     course_id:f.get("course_id"),
     teacher_id:user.id,
     title,
     description:String(f.get("description")||"").trim(),
     event_type:f.get("event_type"),
     event_date:eventDate.toISOString()

    });

    if(error)throw error;

    calSelected=calKey(eventDate);
    calMonth=new Date(
     eventDate.getFullYear(),
     eventDate.getMonth(),
     1
    );

    toast("✅ Tadbir kalendarga qo‘shildi!");

    await calLoadData();
    calDraw();

   }catch(error){

    fail(error);

   }finally{

    if(button){
     button.disabled=false;
     button.textContent="Tadbirni kalendarga qo‘shish";
    }

   }

  });

 }

}

/* KALENDAR BO'LIMINI OCHISH */

async function renderCalendar(){

 const page=$("page");

 page.innerHTML=`
  <div class="card">
   <h3>📅 Aqlli kalendar</h3>
   <p>Ma’lumotlar yuklanmoqda...</p>
  </div>`;

 try{

  await calLoadData();
  calDraw();

 }catch(error){

  console.error("Kalendar xatosi:",error);

function goalDateKey(date){

 const y=date.getFullYear();
 const m=String(date.getMonth()+1).padStart(2,"0");
 const d=String(date.getDate()).padStart(2,"0");

 return `${y}-${m}-${d}`;

}

function goalGetWeek(){

 const today=new Date();

 const monday=new Date(
  today.getFullYear(),
  today.getMonth(),
  today.getDate()
 );

 const offset=(monday.getDay()+6)%7;

 monday.setDate(monday.getDate()-offset);

 const sunday=new Date(monday);
 sunday.setDate(monday.getDate()+6);

 const nextMonday=new Date(monday);
 nextMonday.setDate(monday.getDate()+7);

 return {
  start:goalDateKey(monday),
  end:goalDateKey(sunday),
  startISO:monday.toISOString(),
  endISO:nextMonday.toISOString(),
  monday,
  sunday
 };

}

function goalAverage(values){

 if(!values.length)return 0;

 return values.reduce((a,b)=>a+b,0)/values.length;

}

async function goalLoadData(week){

 const [goalResult,gradeResult,homeworkResult,attendanceResult]=
  await Promise.all([

   db.from("personal_goals")
    .select("id,title,goal_type,target_value,week_start,created_at")
    .eq("user_id",user.id)
    .eq("week_start",week.start)
    .order("created_at",{ascending:true}),

   db.from("grades")
    .select("grade,created_at")
    .eq("student_id",user.id)
    .gte("created_at",week.startISO)
    .lt("created_at",week.endISO),

   db.from("submissions")
    .select("id,submitted_at")
    .eq("student_id",user.id)
    .gte("submitted_at",week.startISO)
    .lt("submitted_at",week.endISO),

   db.from("attendance")
    .select("status,attendance_date")
    .eq("student_id",user.id)
    .gte("attendance_date",week.start)
    .lte("attendance_date",week.end)

  ]);

 if(goalResult.error)throw goalResult.error;
 if(gradeResult.error)throw gradeResult.error;
 if(homeworkResult.error)throw homeworkResult.error;
 if(attendanceResult.error)throw attendanceResult.error;

 const grades=(gradeResult.data||[])
  .map(x=>Number(x.grade))
  .filter(x=>Number.isFinite(x));

 const homework=homeworkResult.data||[];
 const attendance=attendanceResult.data||[];

 const gradeAverage=goalAverage(grades);

 const present=attendance.filter(
  x=>x.status==="present"
 ).length;

 return {
  goals:goalResult.data||[],
  gradeAverage,
  gradeCount:grades.length,
  homeworkCount:homework.length,
  attendanceCount:attendance.length,
  present
 };

}

/* MAQSADNING NATIJASINI HISOBLASH */

function goalCalculate(goal,data){

 const target=Number(goal.target_value);

 let current=0;
 let unit="";

 if(goal.goal_type==="grade_average"){

  current=data.gradeAverage;
  unit="ball";

 }else if(goal.goal_type==="homework"){

  current=data.homeworkCount;
  unit="ta vazifa";

 }else if(goal.goal_type==="attendance"){

  current=data.present;
  unit="ta dars";

 }

 const progress=target>0
  ?Math.min(100,(current/target)*100)
  :0;

 const complete=current>=target;

 return {
  current,
  target,
  progress,
  complete,
  unit
 };

}

                ${aiBusy ? "Kutilmoqda..." : "Yuborish ➤"}
              </button>

            </div>

          </form>

        </div>

        <div class="ai-quick">

          <button type="button" data-ai-prompt="Matematikadan kasrlarni sodda tushuntirib ber.">
            ➗ Matemатика
          </button>

          <button type="button" data-ai-prompt="Ingliz tilida zamonlarni tushuntirib ber.">
            🇬🇧 Ingliz tili
          </button>

          <button type="button" data-ai-prompt="Fizikadagi kuch va harakat mavzusini tushuntirib ber.">
            ⚛️ Fizika
          </button>

          <button type="button" data-ai-prompt="Menga 5 ta matematika mashqi tuzib ber. Javoblarini darhol ko‘rsatma.">
            📝 Mashqlar
          </button>

        </div>

        <div class="ai-warning">
          📌 AI Ustozning javoblari yordamchi ma'lumot hisoblanadi.
          Muhim topshiriqlarda yechimni darslik yoki ustoz bilan ham tekshiring.
        </div>

      </div>
    `;

    const messages = $("aiMessages");

    if(messages){
      messages.scrollTop = messages.scrollHeight;
    }

    $("aiForm").addEventListener("submit", async event=>{

      event.preventDefault();

      const input = $("aiInput");

      await aiSend(input.value);

    });

    $("aiClearBtn").addEventListener("click",()=>{

      if(aiBusy)return;

      aiMessages = [];

      aiRenderPage();

    });

    page.querySelectorAll("[data-ai-prompt]").forEach(button=>{

      button.addEventListener("click",()=>{

        if(aiBusy)return;

        aiSend(button.dataset.aiPrompt);

      });

    });

  }

  /* SUHBAT TARIXINI QISQA KONTEXTGA AYLANTIRISH */

  function aiBuildMessage(newQuestion){

    const previous = aiMessages
      .slice(0,-1)
      .slice(-6)
      .map(item=>
        (item.role==="user"?"O‘quvchi: ":"AI Ustoz: ")+
        item.content
      )
      .join("\n");

    if(!previous){
      return newQuestion;
    }

    const prefix =
      "Oldingi suhbatdan qisqa kontekst:\n";

    const suffix =
      "\n\nYangi savol: "+newQuestion;

    const available = 1800-prefix.length-suffix.length;

    if(available<=0){
      return newQuestion;
    }

    const context = previous.slice(-available);

    return prefix+context+suffix;

  }

  /* SERVERDAN XATOLIK MATNINI OLISH */

  async function aiReadError(error){

    try{

      if(error?.context?.json){

        const detail=await error.context.json();

        if(detail?.error){
          return detail.error;
        }

      }

    }catch(e){

      console.warn("AI xatolik tafsilotini o‘qib bo‘lmadi.");

    }

    return error?.message||"AI Ustozga ulanishda xatolik.";

  }

  /* AI'GA SAVOL YUBORISH */

  async function aiSend(rawMessage){

    if(aiBusy)return;

    const message=String(rawMessage||"").trim();

    if(!message){
      toast("Avval savol yozing.");
      return;
    }

    if(message.length>1800){
      toast("Savol 1800 belgidan oshmasligi kerak.");
      return;
    }

    if(!db||!user){
      toast("Avval EduLife akkauntingizga kiring.");
      return;
    }

    aiMessages.push({
      role:"user",
      content:message
    });

    aiBusy=true;

    const requestMessage=aiBuildMessage(message);

    aiRenderPage();

    try{

      const {data,error}=await db.functions.invoke(
        "ai-tutor",
        {
          body:{
            message:requestMessage
          }
        }
      );

      if(error){

        const errorMessage=await aiReadError(error);

        throw new Error(errorMessage);

      }

      if(!data?.success||!data?.answer){

        throw new Error(
          data?.error||"AI javobi olinmadi."
        );

      }

      aiMessages.push({
        role:"assistant",
        content:String(data.answer)
      });

    }catch(error){

      console.error("AI USTOZ XATOSI:",error);

      aiMessages.push({
        role:"assistant",
        content:"⚠️ "+(
          error?.message||
          "AI Ustoz bilan bog‘lanib bo‘lmadi. Internetni tekshiring."
        )
      });

    }finally{

      aiBusy=false;

      aiRenderPage();

    }

  }

  /* MENYUGA QO‘SHISH */

  window.buildNav=function(){

    aiPreviousBuildNav();

    const nav=$("nav");

    if(!nav)return;

    if(nav.querySelector('[data-page="ai-tutor"]'))return;

    const button=document.createElement("button");

    button.type="button";
    button.dataset.page="ai-tutor";
    button.className=currentPage==="ai-tutor"?"active":"";
    button.innerHTML="🎓 &nbsp; AI Ustoz";

    button.addEventListener("click",()=>{

      window.go("ai-tutor");

    });

    nav.appendChild(button);

  };

  /* SAHIFANI OCHISH */

  window.go=async function(page){

    if(page!=="ai-tutor"){

      return aiPreviousGo(page);

    }

    currentPage="ai-tutor";

    $("sidebar").classList.remove("open");

    buildNav();

    aiRenderPage();

  };

  /* CHIQQANDA SUHBATNI TOZALASH */

  window.logout=async function(){

    aiMessages=[];

    aiBusy=false;

    return aiPreviousLogout();

  };

})();
</script>
